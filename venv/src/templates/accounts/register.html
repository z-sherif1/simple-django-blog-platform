{% extends 'base.html' %}
{% block title %}
    Register
{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-head">
            <div class="form-icon">
                <i class="bi bi-person-plus"></i>
            </div>
            <h1>Create account</h1>
            <p>Join the community and start sharing your ideas.</p>
        </div>
        <form method='POST'>
            {% csrf_token %}
            {{form.as_p}}
            <button type='submit' class="btn btn-primary">Register</button>
        </form>
        <p class="auth-switch">
            Already have an account?
            <a href="{% url 'login' %}">Login</a>
        </p>
    </div>
</div>
{% endblock %}
