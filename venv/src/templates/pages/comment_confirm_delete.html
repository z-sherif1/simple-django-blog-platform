{% extends 'base.html' %}
{% block title %}
    Delete Comment
{% endblock %}
{% block content %}
<div class="delete-page">
    <div class="delete-card">
        <!-- Icon -->
        <div class="delete-icon">
            <i class="bi bi-trash3"></i>
        </div>
        <!-- Title -->
        <h1>
            Delete Comment
        </h1>
        <p class="delete-warning">
            Are you sure you want to delete this comment?
        </p>
        <!-- Comment Preview -->
        <div class="delete-post-preview">
            <div class="comment-user mb-3">
                <div class="comment-avatar">
                    <i class="bi bi-person"></i>
                </div>
                <strong>
                    {{ object.user.username }}
                </strong>
            </div>
            <p>
                "{{ object.content }}"
            </p>
        </div>
        <!-- Actions -->
        <div class="delete-actions">
            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">
                    <i class="bi bi-trash"></i>
                    Yes, Delete Comment
                </button>
            </form>
            <a href="{% url 'post_detail' object.post.pk %}" class="btn btn-outline-secondary">
                Cancel
            </a>
        </div>
    </div>
</div>
{% endblock %}
