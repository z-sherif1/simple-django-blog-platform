{% extends 'base.html' %}
{% block title %}
    Delete Post
{% endblock %}
{% block content %}
<div class="delete-page">
    <div class="delete-card">
        <div class="delete-icon">
            <i class="bi bi-trash3"></i>
        </div>
        <h1>
            Delete Post
        </h1>
        <p class="delete-warning">
            Are you sure you want to delete this post?
        </p>
        <div class="delete-post-preview">
            <h3>
                {{ object.title }}
            </h3>
            <p>
                {{ object.content|truncatewords:25 }}
            </p>
        </div>
        <div class="delete-actions">
            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">
                    <i class="bi bi-trash"></i>
                    Yes, Delete Post
                </button>
            </form>
            <a href="{% url 'post_detail' object.pk %}" class="btn btn-outline-secondary">
                Cancel
            </a>
        </div>
    </div>
</div>
{% endblock %}
